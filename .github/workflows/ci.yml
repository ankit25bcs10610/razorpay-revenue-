name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Tests
        run: uv run pytest
      - name: Reproduce the measured batch
        run: uv run python -m revrecover.evaluation.batch
      - name: Failure demo
        run: uv run python -m revrecover.evaluation.failure_demo
