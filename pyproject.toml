[project]
name = "revrecover"
version = "0.1.0"
description = "AI Revenue Recovery Agent — Razorpay AI Buildathon Track 3"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revrecover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
