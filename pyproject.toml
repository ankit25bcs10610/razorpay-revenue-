[project]
name = "revrecover"
version = "0.1.0"
description = "AI Revenue Recovery Agent — Razorpay AI Buildathon Track 3"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "pytest>=8.0",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revrecover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "UP042"]  # (str, Enum) kept deliberately for wire compat
